<template>
   <template if:true={showButton}>
    <lightning-button variant="brand"
       label="Dupliquer et Sélectionner un magasin"
       onclick={openModal}
       class="slds-m-left_x-small"></lightning-button>
    <template if:true={showModal}>
       <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
          <div class="slds-modal__container">
             <header class="slds-modal__header">
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Liste des magasins de détail les plus proches</h2>
             </header>
             <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
               <template if:true={loadingMessage}>
                  <p>{loadingMessage}</p>
               </template>
                <template for:each={addresses} for:item="address">
                    <div key={address.Id} class="address-item">
                        <lightning-input type="radio" label={address.displayName} 
                                         name="addressSelection" 
                                         onchange={handleRadioChange}
                                         value={address.Id}>
                        </lightning-input>
                    </div>
                </template>              
            </div>

            <template if:true={isLoading}>
               <div style="position: absolute; width: 100%; height: auto; display: flex; justify-content: center; align-items: center; background-color: transparent;">
                  <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
              </div>
            </template>

             <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={openCreateRetailStoreModal}>Créer un nouveau magasin et dupliquer la visite</button>
                <button class="slds-button slds-button_neutral" onclick={closeModal}>Annuler</button>
                <button class="slds-button slds-button_success" onclick={handleOkClick} disabled={isDisabled}>Ok</button>
             </footer>
          </div>
       </section>
       <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={showRSModal}>
      <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
         <c-inwi-c-g-c_-create-retail-storeon-visit visit-page={recordId} onclosemodal={closeCreateRetailStoreModal}></c-inwi-c-g-c_-create-retail-storeon-visit>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
   </template>
   </template>
 </template>
