<template>
  <lightning-card title="Accès Orange">
    <div class="slds-p-around_medium">
      <lightning-radio-group
        label="Avez-vous de la Fibre Orange ?"
        name="orangeAccess"
        options={orangeOptions}
        value={hasOrangeAccess}
        type="radio"
        onchange={handleOrangeAccessChange}
      >
      </lightning-radio-group>

      <template if:true={ShowInputND}>
        <lightning-input
          label="ND"
          name="ND"
          value={ND}
          onchange={handleInputChange}
          required
          maxlength="10"  minlength="10"  pattern="^(05|08)[0-9]{0,9}$" 
          message-when-pattern-mismatch="numero de designation doit être au format 05XXXXXXXXX ou 08XXXXXXXXX">
        >
        <!-- Y_MH MGEN3790 FTTH-Transfert à 3 begin -->
        </lightning-input>
 <lightning-input
          label="Identifiant client"
          name="IdClient"
          value={IdClient}
          onchange={handleInputChange}
          required
        >
        </lightning-input>
        
 <!-- <lightning-input
          label="RIO"
          name="RIO"
          value={RIO}
          onchange={handleInputChange}
        >
        </lightning-input> -->
        <!-- Y_MH MGEN3790 FTTH-Transfert à 3 end -->
      </template>
      <br />
      <template if:true={showMap}>
        <div class="button-container">
          <lightning-button
            class="btn-eligible"
            variant="brand"
            label="Tester mon éligibilité"
            onclick={checkEligibilityFTTH}
            if:true={isSearchDone}
          ></lightning-button>
          <br />
          <lightning-button
            class="btn-acqui"
            variant="brand"
            label="Suivant"
            onclick={redirectAcquisition}
            if:true={isServiceAccIdCreated}
          >
          </lightning-button>
          <br />
        </div>
      </template>

      <iframe
        if:true={showMap}
        src="/apex/inwiB2C_EligibilityOrange"
        style="width: 100%; height: 800px; border: none"
      ></iframe>
    </div>

    <template if:true={showMap}>
      <div class="bordered-box">
        <div class="content-noadress">
          <div class="icon-text">
            <lightning-icon
              class="color-icon"
              size="small"
              icon-name="utility:home"
              alternative-text="Home"
            ></lightning-icon>
            <span class="large-text">Je ne trouve pas ma résidence</span>
          </div>
          <lightning-button
            class="new-address-button"
            label="Nouvelle adresse"
            variant="brand"
            onclick={restartEligibilityWithNewCentralGPS}
          ></lightning-button>
        </div>
      </div>
    </template>

     <div class="slds-grid slds-grid_align-end">
    <lightning-button label="Valider" variant="brand" onclick={checkNDIAM}  if:true={ShowInputND} class="slds-float_right"
        style="padding: 10px; margin-top: 40px;"></lightning-button>
</div>
  </lightning-card>
</template>
