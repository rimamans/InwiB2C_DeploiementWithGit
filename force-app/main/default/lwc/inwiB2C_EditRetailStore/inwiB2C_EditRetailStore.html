<template>
    <lightning-card style="background: #F8F8FA">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- Left Column -->
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="checkbox" label="Avez-vous un dealer ?" checked={getIsDealer}
                        onchange={handleChange} name="IsDealer"></lightning-input>
                    <lightning-input type="checkbox" label="Dealer est identifié ?" onchange={handleChange}
                        value={getIsDealerId} name="isDealerIdentifier" checked={isDealerIdentifier}>
                    </lightning-input>
                    <lightning-input type="checkbox" label="App M3a atajir Installé?" onchange={handleChange}
                        value={getIsDistributeurAppMobile} name="isDistributeurAppMobile"
                        checked={isDistributeurAppMobile}>
                    </lightning-input>
                    <lightning-input type="text" label="Prénom" value={getPrenom} onchange={handleChange} name="Prenom"
                        required="true"></lightning-input>
                    <lightning-input type="text" label="Nom" value={getNom} onchange={handleChange} name="Nom"
                        required="true"></lightning-input>
                    <lightning-input type="text" label="Nom de l'Acteur Marché" value={getNomActeurMarche}
                        onchange={handleChange} name="NomActeurMarche"></lightning-input>
                    
                    <lightning-input type="tel" label="MDN Dealer" value={getMDNDealer} onchange={handleChange}
                        data-theid="Tel" name="MDNDealer" required={getIsDealer}></lightning-input>
                    <lightning-input type="tel" label="MDN Dealer 2" value={getMDNDealer2} onchange={handleChange}
                        data-theid="Tel" name="MDNDealer2" required={getIsDealer}></lightning-input>

                    <lightning-input type="tel" label="Numéro de contact 1" value={getContactNumber1}
                        onchange={handleChange} name="ContactNumber1"></lightning-input>
                    <lightning-input type="tel" label="Numéro WhatsApp" value={getContactNumber2}
                        onchange={handleChange} name="ContactNumber2"></lightning-input>

                </div>
            </div>

            <div class="slds-col slds-size_1-of-2">
                <template if:true={showStatusPicklist}>
                    <lightning-record-edit-form record-id={recordId2} object-api-name="RetailStore">
                        <lightning-input-field field-name="inwiCGC_Status__c" onchange={handleStatusChange}
                            variant="label-stacked">
                        </lightning-input-field>
                    </lightning-record-edit-form>
                </template>
                <template if:true={isRejected}>
                    <lightning-input type="text" label="Commentaire de rejet" name="CommentRejet" value={commentRejet}
                        onchange={handleChange}>
                    </lightning-input>
                </template>
                <lightning-combobox label="Région" options={regionOptions} value={selectedRegion} name="Region"
                    onchange={handleRegionChange}>
                </lightning-combobox>
                <lightning-combobox label="Route" options={localisationOptions} value={selectedLocalisation}
                    name="Localisation" onchange={handleLocalisationChange}>
                </lightning-combobox>

                <lightning-combobox label="Circuit" options={circuitOptions} onchange={handleCircuitChange}
                    value={selectedCircuit} name="Circuit" placeholder="Veuillez sélectionner une localisation">
                </lightning-combobox>
                <lightning-record-edit-form record-id={recordId2} object-api-name="RetailStore">
                    <div class="slds-grid slds-grid_vertical">
                        <lightning-input-field field-name="inwiCGC_TypeActivite__c" onchange={handleChange}
                            variant="label-stacked" value={getTypeactivite} name="Typeactivite"
                            required="true"></lightning-input-field>
                    </div>
                </lightning-record-edit-form>
                <lightning-record-edit-form record-id={recordId2} object-api-name="RetailStore">
                    <div class="slds-grid slds-grid_vertical">
                        <lightning-input-field field-name="inwib2c_Segment__c" onchange={handleChange}
                            variant="label-stacked" value={getSegment} name="Segment"
                            required={getIsDealer}></lightning-input-field>
                    </div>
                </lightning-record-edit-form>

                <lightning-record-edit-form record-id={recordId2} object-api-name="RetailStore">
                    <div class="slds-grid slds-grid_vertical">
                        <lightning-input-field field-name="inwiCGC_Distributeur__c" onchange={handleChange}
                            variant="label-stacked" value={getDistributeur} name="Distributeur"
                            required="true"></lightning-input-field>
                    </div>
                </lightning-record-edit-form>

                <lightning-file-upload label="Photo du Magasin" name="retailStorePhoto" accept=".jpg,.png,.jpeg"
                    record-id={recordId2} onuploadfinished={handleFileUploadFinished}>
                </lightning-file-upload>
                <lightning-button label="Preview Photo" onclick={openModal} class="slds-m-top_small"></lightning-button>

                <template if:true={isModalOpen}>
                    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                    title="Close" onclick={closeModal}>
                                    <lightning-icon icon-name="utility:close" alternative-text="close"
                                        size="small"></lightning-icon>
                                    <span class="slds-assistive-text">Close</span>
                                </button>
                                <h2 class="slds-text-heading_medium">Photo Preview</h2>
                            </header>
                            <div class="slds-modal__content slds-p-around_medium">
                                <template if:true={imageUrl}>
                                    <img src={imageUrl} alt="Photo du Magasin" style="width: 100%; max-width: 400px;" />
                                </template>
                                <template if:false={imageUrl}>
                                    <p>No image available for preview.</p>
                                </template>
                            </div>
                            <footer class="slds-modal__footer">
                                <lightning-button variant="neutral" label="Close"
                                    onclick={closeModal}></lightning-button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>
            </div>
        </div>
        <template if:true={showOtpModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeOtpModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close"
                                size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Vérification OTP</h2>
                        <p class="slds-m-top_x-small slds-text-color_weak">
                            Saisissez le code reçu pour chaque MDN. L’enregistrement sera possible une fois tous les
                            MDNs vérifiés.
                        </p>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <template for:each={otpItems} for:item="row" for:index="index">
                            <div key={row.key} class="slds-box slds-m-bottom_small">
                                <div class="slds-grid slds-wrap slds-gutters_small slds-align_absolute-center">
                                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small">
                                        <strong>{row.label}</strong>
                                        <span class="slds-text-color_weak"> — {row.mdn}</span>
                                        <template if:true={row.verified}>
                                            <span class="slds-badge slds-theme_success slds-m-left_x-small">✅
                                                Vérifié</span>
                                        </template>
                                        <template if:false={row.verified}>
                                            <span class="slds-badge slds-theme_warning slds-m-left_x-small">⏳ En
                                                attente</span>
                                        </template>
                                    </div>

                                    <div class="slds-col slds-medium-size_2-of-3 slds-size_1-of-1">
                                        <lightning-input type="text" input-mode="numeric" pattern="[0-9]*" maxlength="6"
                                            label={row.labelText} data-index={index} value={row.code}
                                            onchange={handleOtpCodeChange} disabled={row.verified}>
                                        </lightning-input>

                                        <template if:true={row.error}>
                                            <div class="slds-text-color_error slds-m-top_x-small">{row.error}</div>
                                        </template>
                                    </div>

                                    <div class="slds-col slds-medium-size_1-of-3 slds-size_1-of-1 slds-m-top_small">
                                        <lightning-button variant="neutral" label="Renvoyer" data-index={index}
                                            onclick={resendForIndex} class="slds-m-right_x-small">
                                        </lightning-button>

                                        <lightning-button variant="brand" label={row.buttonLabel}
                                            disabled={row.disableVerify} onclick={verifySingleIndex} data-index={index}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Annuler" onclick={closeOtpModal}></lightning-button>
                        <lightning-button variant="brand" label={saveOtpButtonLabel} disabled={isSaveDisabled}
                            onclick={finishSaveAfterOtp}>
                        </lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <div class="slds-p-around_medium">
            <button class="slds-button slds-button_brand" onclick={handleSave}>Sauvegarder</button>
        </div>

        <div class="spinner">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" variant="brand" size="large"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
