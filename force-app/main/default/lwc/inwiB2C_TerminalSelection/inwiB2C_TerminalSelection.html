<template>

    <template if:true={imeiAttribute}>
        <lightning-combobox
                    name={marqueAttribute.label}
                    label={marqueAttribute.label}
                    value={marqueAttributeValue}
                    options={marqueOptions}
                    onchange={handleChangeMarque}></lightning-combobox>

    
        <lightning-combobox
                    name={modelAttribute.label}
                    label={modelAttribute.label}
                    value={modeleAttributeValue}
                    options={modeleOptions}
                    onchange={handleChangeModele}></lightning-combobox>

        <div onkeyup={handleKeyUp}>
            <lightning-input
                value={imeiAttributeValue}
                name={serialTypeAttributeValue}
                label={imeiLabel}
                type="text"
                onchange={hanldleImeiEntry}
                class="imeiInput"
                disabled={imeiDisabled}
            ></lightning-input>
        </div>

    </template>


    
    
</template>
