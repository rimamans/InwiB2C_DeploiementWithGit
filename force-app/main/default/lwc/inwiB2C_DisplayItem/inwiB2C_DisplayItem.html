<template>

    
    <template if:true={item}>

        
        <lightning-card  title={item.Name}>

                <template if:true={treeTableStructure}>
                    <div class="slds-m-top_medium slds-m-bottom_x-large">
   
                        <div class="slds-p-around_medium lgc-bg">
                            <lightning-tree-grid
                                columns={columns}
                                data={treeTableStructure}
                                key-field="inwiB2C_Id"
                                onrowaction={handleRowAction}
                                hide-checkbox-column= true
                                expanded-rows={gridExpandedRows}
                            >
                        </lightning-tree-grid>
                        </div>
                    </div>
                </template>
            

            <lightning-button label="Modifier attributs"  onclick={SaveAndNext} ></lightning-button>
            <lightning-button label="Finaliser"  onclick={SaveAndQuit} ></lightning-button>

               

        </lightning-card>

    </template>
    
</template>
