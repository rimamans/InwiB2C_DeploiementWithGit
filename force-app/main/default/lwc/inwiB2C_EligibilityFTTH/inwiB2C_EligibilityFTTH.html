<template>
  <lightning-card title="Saisie d'adresse">
    <div class="slds-p-around-medium input-wrapper">
      <lightning-Input
        class="combo"
        type="search"
        placeholder="Entrer une province/ville"
        label="Province/ville"
        value={searchProvince}
        onclick={showProvinceOptionsHandler}
        onchange={InitSearchProvince}
      ></lightning-Input>

      <template if:true={showProvinceOptions}>
        <div class="dropdown-container">
          <ul
            style="max-width: 100%; margin-left: 20px"
            class="slds-listbox slds-listbox_vertical slds-m-top_small"
          >
            <template for:each={filteredProvinceVilleOptions} for:item="option">
              <li key={option.value}>
                <button
                  class="dropdown-option"
                  onclick={ProvinceOptionSelect}
                  data-value={option.value}
                >
                  {option.label}
                </button>
              </li>
            </template>
          </ul>
        </div>
      </template>

      <lightning-Input
        class="combo"
        type="search"
        placeholder="Entrer votre quartier"
        label="Quartier"
        value={searchQuartier}
        onclick={showQuartierOptionsHandler}
        onchange={InitSearchQuartier}
        disabled={quartierLoading}
      ></lightning-Input>

      <template if:true={showOptions}>
        <div class="dropdown-container">
          <ul
            style="max-width: 100%; margin-left: 20px"
            class="slds-listbox slds-listbox_vertical slds-m-top_small"
          >
            <template for:each={filteredQuartiersOptions} for:item="option">
              <li key={option.value}>
                <button
                  class="dropdown-option"
                  onclick={QuartierOptionSelect}
                  data-value={option.value}
                >
                  {option.label}
                </button>
              </li>
            </template>
          </ul>
        </div>
      </template>

      <lightning-Input
        class="combo"
        type="search"
        placeholder="Entrer votre voie"
        label="Voie"
        value={searchVoie}
        onclick={showVoieOptionsHandler}
        onchange={InitSearchVoie}
        disabled={voieLoading}
      ></lightning-Input>

      <template if:true={showVoieOptions}>
        <div class="dropdown-container">
          <ul
            style="max-width: 100%; margin-left: 20px"
            class="slds-listbox slds-listbox_vertical slds-m-top_small"
          >
            <template for:each={filteredVoieOptions} for:item="option">
              <li key={option.value}>
                <button
                  class="dropdown-option"
                  onclick={VoieOptionSelect}
                  data-value={option.value}
                >
                  {option.label}
                </button>
              </li>
            </template>
          </ul>
        </div>
      </template>

      <lightning-input
        class="combo"
        type="text"
        label="Numéro dans la voie"
        placeholder="Entrer votre numéro dans la voie "
        value={numeroVoieValue}
        onchange={handleNumVoieChange}
        disabled={NumVoieLoading}
        maxlength="10"

      >
      </lightning-input>
    </div>
  </lightning-card>

  <lightning-card title="Je teste mon éligibilité">
    <div class="button-container">
      <lightning-button
        class="btn-eligible"
        variant="brand"
        label="Tester mon éligibilité"
        onclick={checkEligibilityFTTH}
        if:true={isSearchDone}
      ></lightning-button>
      <br />
      <lightning-button
        class="btn-acqui"
        variant="brand"
        label="Suivant"
        onclick={redirectAcquisition}
        if:true={isServiceAccIdCreated}
      >
      </lightning-button>
      <br />
    </div>

    <iframe
      src="/apex/GoogleMapIframe"
      style="width: 100%; height: 800px; border: none"
    ></iframe>
  </lightning-card>
  <div class="bordered-box">
    <div class="content-noadress">
      <div class="icon-text">
        <lightning-icon
          class="color-icon"
          size="small"
          icon-name="utility:home"
          alternative-text="Home"
        ></lightning-icon>
        <span class="large-text">Je ne trouve pas ma résidence</span>
      </div>
      <lightning-button
        class="new-address-button"
        label="Nouvelle adresse"
        variant="brand"
        onclick={restartEligibilityWithNewCentralGPS}
      ></lightning-button>
    </div>
  </div>
</template>
