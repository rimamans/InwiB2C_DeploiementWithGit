<template>

    <lightning-combobox
                    class="slds-size_1-of-2"
                    name="suspentionType"
                    label="Type suspension"
                    value={suspentionType}
                    options={options}
                    onchange={handleChangeDropDown} required="true" style="width:400px;"></lightning-combobox>
    <lightning-combobox
                    class="slds-size_1-of-2"
                    name="Motif"
                    label="Motif"
                    value={Motif}
                    options={optionsMotif}
                    onchange={handleChangeDropDownMotif} required="true"  style="width:400px;"></lightning-combobox>
    <br>
    <div style="float: right; margin-top: 10px;">
    <lightning-button variant="brand" label="Suivant"
                            onclick={handleSave}  disabled={disableSoumettre} class="slds-var-m-left_x-small" style="width: 112px;">
                        </lightning-button>
   <!--<lightning-button label="Soumettre"  onclick={handleSave}  disabled={disableSoumettre} class="slds-button slds-button_brand slds-button_stretch" ></lightning-button>--> 
    </div> 
</template>
