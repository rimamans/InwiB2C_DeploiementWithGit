<template>
    
    <div class="via-slds riders-list-canvas container-table-canvas" if:true={records}>
        <div class="slds-card slds-p-around--small np-card">

           

            <div class="slds-p-right_small slds-m-bottom_xx-small slds-show_inline-block slds-size_12-of-12 slds-medium-size_12-of-12">
                <div class="slds-grid slds-gutters" style="margin-bottom: 30px;">
                    <div class="slds-col">
                        <lightning-input type="date" name="date" class="date" label="Date"
                            value={date} onchange={updateSearch}>
                        </lightning-input>
                    </div>
                   
                    <div class="slds-col">
                        <lightning-combobox placeholder="Choisir une option" onchange={handleChangeState}
                                value={status_value} label="Filtre" options={pickListValues3}
                                data-dataname="pickListValues3">
                        </lightning-combobox>
                    </div>
                    <div class="slds-col">
                        <lightning-input type="number" name="amount" class="amount" label="Montant"
                            onchange={handleAmountChange}>
                        </lightning-input>
                    </div>
                    <div class="slds-col" style="margin-top: 23px">
                        <lightning-button label="Appliquer" title="filtrer" icon-name="utility:filterList" class="slds-m-left_x-small"  onclick={handleFilter}>
                        </lightning-button>
                    </div>
                   
                    
                </div>
                <div class="slds-m-bottom_xx-large overflowVisible ">
                  
                    <div >                    
                        <div class="wraperClass">
                            
                    
                            <lightning-datatable
                                key-field="Id"
                                class="tab-style slds-table slds-table_bordered slds-table_col-bordered" 
                                columns={columns}
                                data={records} 
                                draft-values={draftValues}
                                onrowaction={handleRowAction}
                                hide-checkbox-column= true>
                            </lightning-datatable>
                        </div>
                    </div>
            </div>
                
            </div>
        </div>

    </div>


</template>
