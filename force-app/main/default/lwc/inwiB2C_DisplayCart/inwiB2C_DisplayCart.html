<template>

    

    <template if:true={vlccart}  >


            <div class="wraperClass ">
                <table class="sty-table-case slds-table slds-table_bordered slds-table_fixed-layout">
                    <thead>
                    <tr class="">

                        
                        <th class="" scope="col">
                        <div class="slds-truncate" title="Produit">Produit</div>
                        </th>
                        <th class="" scope="col">
                        <div class="slds-truncate" title="oneTime">Prix unitaire</div>
                        </th>
                        
                        

                        
                    </tr>
                    </thead>
                    <tbody>
                    <template for:each={updatedCart} for:item="item" >
                        <tr key ={item.Id.value} >
                            <td class="slds-cell-wrap" > <div class="slds-line-clamp">{item.Name}</div> </td>
                            <td class="slds-cell-wrap" > 
                                <lightning-formatted-number value={item.vlocity_cmt__EffectiveOneTimeTotal__c.value}
                                        format-style="currency" currency-code="MAD" currency-display-as="symbol">
                                    </lightning-formatted-number>
                             </td>
                            
                            

                        </tr>
                    </template>
                
                    </tbody>
                </table>

            </div>
            </template>

    
</template>
