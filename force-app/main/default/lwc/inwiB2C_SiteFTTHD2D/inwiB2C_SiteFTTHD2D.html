  <br><template if:true={eligible}>
    <strong class="slds-align_absolute-center" style="height:5rem"> Liste des plaques</strong>

    <br><!--//CHB B-10015 ano 21/06/2023 ajout search-->
    <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_1-of-4" style="border-right: 1px solid rgb(217, 219, 221);">
            <div>
                <lightning-input type="text" value={search} onchange={handleChangeSearch} label="Rechercher par nom"></lightning-input>
            </div>
           
        </div>
        <div class="slds-col slds-size_3-of-4">
            <div class="wraperClass " style="min-height: 250px;">

                <table class="sty-table-case slds-table slds-table_bordered slds-table_fixed-layout">
                    <thead>
                        <tr class="">
                            <th class="" scope="col">
                    <div class="slds-truncate" title="radios">choix</div>
                </th>
                <th class="" scope="col">
                    <div class="slds-truncate">Ville</div>
                </th>
                <th class="" scope="col">
                    <div class="slds-truncate">Reférence</div>
                </th>
                <th class="" scope="col">
                    <div class="slds-truncate">Nom</div>
                </th>
                <th class="" scope="col">
                    <div class="slds-truncate">Vendeur</div>
                </th>
                     
            
            </tr>
              </thead>
              <tbody>
                  <template  for:each={__dataplaque} for:item="item">
                      <tr key={item.index}  style="border-style: solid; border-color: #92107F; padding: 10px; border-radius: 10px;">
                      
                          <td><input type="radio" name="item.Id" onclick={handleSelectPlaque}
                               id={item.Id} data-idline={item.Id}
                               data-city={item.place.city} 
                               data-referredtype={item.referredType} 
                               data-name={item.name} 
                               data-vendor={item.vendor} 
                               data-statut={item.statut}
                               

                               />
                              </td>
                          <td class="slds-cell-wrap">
                              {item.place.city}
                          </td>
                          <td class="slds-cell-wrap">
                              {item.referredType}
                          </td>
                          <td class="slds-cell-wrap">
                              {item.name}
                          </td>
                          <td class="slds-cell-wrap">
                            {item.vendor}
                        </td>
                      </tr>
                  </template>
              </tbody>
          </table>
          

     </div></div>
  </div>
  
</template>

<template if:true={step}>
    <template if:true={stepAd}>
    <div style="position: relative;padding:20px;">

    </div>
</template>

    </template><!--
    <lightning-button style="margin-right: 5px; " variant="brand" label="Annuler la commande" onclick={handleCancel}>
    </lightning-button>-->

    <template if:true={stepEligible}>
       <!-- modal start -->      
       <template if:true={isShowModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
           <div class="slds-modal__container">
            <!-- modal header start -->
              <header class="slds-modal__header">
                 <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                    <lightning-icon icon-name="utility:close"
                       alternative-text="close"
                       variant="inverse"
                       size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Confirmer</span>
                 </button>
                 
                 <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Confirmation des informations</h2>
              </header>
          
              <!-- modal body start -->
              <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">

                    <p>Adresse : {optionadresseShow} </p>
              </div>
    
              <!-- modal footer start-->
              <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Annuler</button>
                <button class="slds-button slds-button_neutral" onclick={appelAPIPlaque}>Confirmer</button>
           
              </footer>
           
           </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
     </template>
     <!-- modal end -->
    
    </template>
</template>
