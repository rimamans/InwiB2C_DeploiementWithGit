<template>



    <template if:true={vlccart}>
        <template if:false={__loading}>
            <template if:false={__loadingCart}>

                <lightning-card variant="Narrow" title="Panier" icon-name="standard:webcart">
                    <template if:false={isLivraison}>
                        <template if:false={isShowed}>
                            
                        <lightning-button variant="brand" label="Ajouter un produit" onclick={addProduct} slot="actions" disabled={__disableAddProduct}>
                        </lightning-button>
                        
                        </template>
                    </template>
                  
                    <lightning-button style="margin-left: 10px;" variant="brand" label="valider" onclick={SaveAndNext} disabled={__disableValidate} slot="actions">
                    </lightning-button>

                    <template for:each={__panier} for:item="acc">
                        <p key={acc.itemname}>{acc.itemname}</p>
                    </template>

                    <div class="wraperClass ">
                        <table class="sty-table-case slds-table slds-table_bordered slds-table_fixed-layout">
                            <thead>
                                <tr class="">
                                    <th style="text-align:center;     width: 11%;    font-size: 12px;" class=""
                                        scope="col">
                                        <div class="slds-truncate" title="Produit">Items</div>
                                    </th>
                                    <th style="text-align:center;     font-size: 12px;">
                                        A Payer maintenant
                                    </th>
                                    <th style="text-align:center; font-size: 12px; width: 30%;" class="" scope="col">
                                        <p>Première facture y compris remise</p>
                                    </th> 
                                    <th style="text-align:center;     font-size: 12px;" class="" scope="col">
                                        <p>Abonnement mensuel</p>
                                    </th>
                                    <th style="text-align:center;    font-size: 12px;" class="" scope="col">
                                        <div class="slds-truncate" title="oneTime">Promotion</div>
                                    </th>
                                    <th style="    width: 15%;" scope="col">
                                        <div class="slds-truncate" title="Error"></div>
                                    </th>

                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={__updatedCart} for:item="item">
                                    <tr key={item.itemname} style={item.styleColor}>
                                        <td class="slds-cell-wrap">
                                            <div class="slds-line-clamp">{item.itemname}</div>
                                        </td>
                                        <td class="slds-cell-wrap" style="text-align:center">
                                            <lightning-formatted-number value={item.price} format-style="decimal">
                                            </lightning-formatted-number>
                                        </td>
                                        <td class="slds-cell-wrap" style="text-align:center">
                                            <lightning-formatted-number value={item.price_first_bill}
                                                format-style="decimal">
                                            </lightning-formatted-number>
                                        </td>
                                        <td class="slds-cell-wrap" style="text-align:center">
                                            <lightning-formatted-number value={item.price_abonnement}
                                                format-style="decimal">
                                            </lightning-formatted-number>
                                        </td>
                                        <td class="slds-cell-wrap">
                                            {item.promotion}
                                        </td>
                                        <td class="slds-cell-wrap">
                                            <template if:true={item.isparent}>
                                                <div class="slds-line-clamp">
                                                    <template if:true={isShowedError}>
                                                      <template if:true={item.parent.has_error_messages}>
                                                        <lightning-button-icon icon-name="utility:warning"
                                                            variant="destructive-text" alternative-text="Selectionner"
                                                            name={item.parent} onclick={openModal}>
                                                        </lightning-button-icon>
                                                      </template>
                                                    </template>
                                                    <template if:false={isShowed}>
                                                    <lightning-button-icon icon-name="utility:delete"
                                                        variant="destructive-text" alternative-text="Supprimer"
                                                        name={item.parent} onclick={deleteItem}>
                                                    </lightning-button-icon>
                                            
                                                    <lightning-button-icon icon-name="utility:setup"
                                                        variant="destructive-text" alternative-text="Configurer"
                                                        name={item.parent} onclick={selectItem} disabled={disabledButtonConfig}>
                                                    </lightning-button-icon>
                                                </template>
                                                    
                                                    <template if:false={__isPrintInvoice}>
                                                    <lightning-button-icon icon-name="utility:print"
                                                        variant="destructive-text"
                                                        alternative-text="Simuler première facture" name={item.parent}
                                                        onclick={print}>
                                                    </lightning-button-icon></template>
                                                </div>
                                            </template>
                                        </td>
                                    </tr>
                                </template>

                            </tbody>
                        </table>

                    </div>


                </lightning-card>
            </template>
            <template if:true={__loadingCart}>
                <div style="text-align: center; margin-top: 30px;"><strong>Chargement en cours...</strong></div>
            </template>
        </template>
        <template if:true={__loading}>
            <div style="text-align: center; margin-top: 30px;"><strong>Suppression en cours...</strong></div>
        </template>
    </template>

    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Erreur
                    </h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p><b>Liste des erreurs
                        </b></p>
                    <div>
                        <ul class="slds-m-around_medium">
                            <template for:each={__dataErrors} for:item="error">
                                <li key={error.messageId}>
                                    {error.message}
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <template if:true={isModalOpenBill}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-02" aria-modal="true"
            aria-describedby="modal-content-id-2" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModalBill}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-02" class="slds-text-heading_medium slds-hyphenate">Simulation Premiére
                        Facture</h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                    <p><b>Période Facturée: Du</b>{selectedBill.periodfactureedd} <b> Au
                        </b>{selectedBill.periodfactureedf}</p>
                    <p><b>Jour d'activation du forfait: </b> {selectedBill.activationdate}</p>
                    <p><b>MDN: </b> {selectedBill.numligne}</p>
                    <p><b>Cycle de facturation: </b> {selectedBill.firstdaycycle}</p>
                    <p><b>2eme Facture: </b> {selectedBill.secondbill}</p>
                    <p><b>Nombre de jours forfait au prorata: </b> {selectedBill.days}</p>
                    <p><b>Montant: </b> {selectedBill.priceprorata}</p>
                    <p><b>Un mois complet du forfait: </b> {selectedBill.pricefirstmonth}</p>
                    <p><b>Montant estimatif de la 1ere facture: </b> {selectedBill.total}</p>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_brand" onclick={closeModalBill} title="OK">OK</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
