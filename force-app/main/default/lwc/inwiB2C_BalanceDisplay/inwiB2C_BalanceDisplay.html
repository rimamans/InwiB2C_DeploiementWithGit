<template >
    <div class="via-slds riders-list-canvas container-table-canvas" if:true={records}>
        <div class="slds-card slds-p-around--small np-card">
            

           <div class="slds-p-bottom--small">
                <div class="slds-m-bottom_xx-large overflowVisible ">
                    <div >                    
                        <div class="wraperClass ">
                            <lightning-datatable
                                class="tab-style slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered" 
                                key-field="Id"
                                columns={columns}
                                data={records} 
                                draft-values={draftValues}
                                onrowaction={handleRowAction}
                                hide-checkbox-column= true>
                            </lightning-datatable>
                        </div>
                    </div>
            </div>
                
            </div>
        </div>

    </div>

    <template if:true={openUsageDetail}>
        <div class="demo-only" style="height: 640px;">
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" size="medium">
                            </lightning-icon>
                            <span class="slds-assistive-text">Fermer</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Détail des Usages</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <div class="wraperClass ">

                        <lightning-datatable
                            class="tab-style" 

                            key-field="Id"
                            columns={usageColumns}
                            data={usageData} 
                            hide-checkbox-column= true>
                        </lightning-datatable>

                        </div>
                </div>
                <footer class="slds-modal__footer">
                        <lightning-button label="Fermer" variant="neutral" onclick={closeModal}></lightning-button>&nbsp;&nbsp;&nbsp;&nbsp;
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
    </template>


</template>
