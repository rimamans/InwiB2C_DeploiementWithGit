<template>
    <template if:true={vlccart}>
       
        <lightning-card variant="Narrow" title="Panier" icon-name="standard:webcart">
          
            <div class="wraperClass" >
                <div style="float: right; margin-bottom: 10px;">
                <lightning-button variant="brand" label="Configurer" onclick={gotoprecedentstep} slot="actions">
                </lightning-button>
            </div>
        </div>
            

            <div class="wraperClass " style="margin-top: 10px;">
                <table class="sty-table-case slds-table slds-table_bordered slds-table_fixed-layout">
                    <thead>
                        <tr class="">
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Produit">Items</div>
                            </th>
                            <th style="word-wrap: break-word;">
                                A Payer Maintenant
                            </th>
                            <th style="word-wrap: break-word; width: 30%;">
                                Frais additionnels prochaines factures
                            </th>
                            <th class="" scope="col">
                                Prix Mensuel de l'option
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Error"></div>
                            </th>

                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={__updatedCart} for:item="item">
                            <tr key={item.itemname} style={item.styleColor}>
                                <td class="slds-cell-wrap">
                                    <div class="slds-line-clamp">{item.itemname}</div>
                                </td>
                                <td class="slds-cell-wrap">
                                    <lightning-formatted-number value={item.price} format-style="decimal">
                                    </lightning-formatted-number>
                                </td>
                                <td class="slds-cell-wrap">
                                    <lightning-formatted-number value={item.next_bill} format-style="decimal">
                                    </lightning-formatted-number>
                                </td>
                                <td class="slds-cell-wrap">
                                    <lightning-formatted-number value={item.option_price} format-style="decimal">
                                    </lightning-formatted-number>
                                </td>

                                <td class="slds-cell-wrap">
                                    <template if:true={item.isparent}>
                                        <div class="slds-line-clamp">
                                            <template if:true={item.parent.has_error_messages}>
                                                <lightning-button-icon icon-name="utility:warning"
                                                    variant="destructive-text" alternative-text="Selectionner"
                                                    name={item.parent} onclick={openModal}>
                                                </lightning-button-icon>
                                            </template>
                                            <lightning-button-icon icon-name="utility:setup" variant="destructive-text"
                                                alternative-text="Configurer" name={item.parent} onclick={selectItem}>
                                            </lightning-button-icon>
                                        </div>
                                    </template>
                                </td>
                            </tr>
                        </template>

                    </tbody>
                </table>

            </div>

            <div class="wraperClass " style="margin-top: 10px;">
                <div style="float: left;">
                    <lightning-button variant="brand" label="Précédent" onclick={gotoprecedentstep}>
                    </lightning-button>
                </div>
                <div style="float: right;">
                    <lightning-button variant="brand" label="valider" onclick={SaveAndNext} disabled={__disableValidate} slot="actions">
                    </lightning-button>
                </div>
            
            
                 </div>

        </lightning-card>

    </template>

    <template if:true={isModalOpen}>
        <!-- Modal/Popup Box LWC starts here -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box LWC header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Erreur
                    </h2>
                </header>
                <!-- Modal/Popup Box LWC body starts here -->
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p><b>Liste des erreurs
                        </b></p>
                    <div>
                        <ul class="slds-m-around_medium">
                            <template for:each={__dataErrors} for:item="error">
                                <li key={error.messageId}>
                                    {error.message}
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
