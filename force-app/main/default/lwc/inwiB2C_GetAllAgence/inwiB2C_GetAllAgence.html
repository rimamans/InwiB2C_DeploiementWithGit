<template>
    <div class="slds-grid slds-wrap">
      
        
        <div class="slds-col slds-size_4-of-12 slds-m-bottom--medium "> 
          <template if:true={profil}>
           
            <lightning-Input type="search" placeholder="Chercher une Agence"  label="Agence de vente" value={value}  class="agenceName" onchange={handleChanged} disabled >  </lightning-input>
                <div class="slds-col slds-size_12-of-12 slds-m-bottom--medium slds-box"> 
                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                    <template for:each={optionsArray} for:item="item">
                        
                        <li key={item.AgenceId} class="slds-listbox__item">
                         
                          <a >  <p data-idacc={item.AgenceId}
                            data-name={item.Name} data-codeagence={item.CodeAgence} onclick={handleSelect} >{item.CodeAgence},{item.Name}</p> </a>
                             
                       
                            </li>
                        
                        </template>
                    </ul>
                </div>
                </template>  
                <template if:false={profil}>
                    
                    <lightning-Input type="search" placeholder="Chercher une Agence"  label="Agence de vente" value={value}  class="agenceName" onchange={handleChanged} >  </lightning-input>
                        <template if:true={show}>
                        <div class="slds-col slds-size_12-of-12 slds-m-bottom--medium slds-box">
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template for:each={optionsArray} for:item="item">
                                <li key={item.AgenceId} class="slds-listbox__item">
        
                                  <a >  <p data-idacc={item.AgenceId}
                                    data-name={item.Name} data-codeagence={item.CodeAgence} onclick={handleSelect} >{item.CodeAgence},{item.Name}</p> </a>
                                     
                                 
                                    </li>
                                    
                                </template>
                            </ul>
                         </div>
                         </template>
                        </template>           
            
    
</div>
</div>
    
</template>
