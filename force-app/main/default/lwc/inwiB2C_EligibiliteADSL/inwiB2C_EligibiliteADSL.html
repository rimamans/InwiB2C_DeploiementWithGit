<template>
    <template if:true={isLoadinginModal}>
        <div class="exampleHolder">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>
    <template if:false={isLoadinginModal}>
       

             

                        <template if:false={FlagFinalisation}>

                

                            <template if:false={demandeIAM}>
                          

                                <div
                                    style="border-style: solid; border-color: #92107F; padding: 10px; border-radius: 10px;">
                                        Adresse du site au format IAM :

                                        <div class="slds-grid slds-wrap">
                                          <div class="slds-col slds-size_1-of-2">
                           
                                     <label class="slds-form-element__label">Province/Ville<span class="slds-required">*</span></label>
                                    
                                     <lightning-input placeholder="Province/Ville"
                                                    onchange={GetProvince} 
                                                    type="search" onclick={showPicklistOptionsProvince}
                                                    value={labelProvince}>
                                                </lightning-input>
                                           
                                                <div if:true={searchResultsProvince}
                                                    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                                    role="listbox">
                                                    <ul class="slds-listbox slds-listbox_vertical"
                                                        role="presentation" >
                                                        <template for:each={searchResultsProvince}
                                                            for:item="searchResultsProvince">
                                                            <li key={searchResultsProvince.value}
                                                                data-value={searchResultsProvince.value}
                                                                role="presentation"
                                                                onclick={selectSearchResultProv}
                                                                class="slds-listbox__item" >
                                                                <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small "
                                                                    role="option">
                                                                    <span class="slds-media__body">
                                                                        <span class="slds-truncate"
                                                                            title={searchResultsProvince.label} >
                                                                            {searchResultsProvince.label}
                                                                        </span>
                                                                    </span>
                                                                </div>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div></div>
                                           
                                           
                                            <div class="slds-col slds-size_1-of-2">
                                           
                                                <label class="slds-form-element__label">Commune<span class="slds-required">*</span></label>  
                                               
                                                <lightning-input placeholder="Commune" onchange={GetCommune}
                                                    value={labelCommune} type="search"
                                                    onclick={showPicklistOptionsCommune}
                                                    disabled={disableCommune}>
                                                </lightning-input>
                                                <div if:true={searchResultsCommune}
                                                    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                                    role="listbox">
                                                    <ul class="slds-listbox slds-listbox_vertical"
                                                        role="presentation">
                                                        <template for:each={searchResultsCommune}
                                                            for:item="searchResultsCommune">
                                                            <li key={searchResultsCommune.value}
                                                                data-value={searchResultsCommune.value}
                                                                role="presentation"
                                                                onclick={selectSearchResultCommune}
                                                                class="slds-listbox__item">
                                                                <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small "
                                                                    role="option">
                                                                    <span class="slds-media__body">
                                                                        <span class="slds-truncate"
                                                                            title={searchResultsCommune.label}>
                                                                            {searchResultsCommune.label}
                                                                        </span>
                                                                    </span>
                                                                </div>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </div>
                                      
                                            <div class="slds-col slds-size_1-of-2">
                                              
                                                <label class="slds-form-element__label">Quartier<span class="slds-required">*</span></label>
                                               
                                                <lightning-input placeholder="Quartier"
                                                    onchange={GetQuartier}
                                                    value={labelQuartier} type="search"
                                                    onclick={showPicklistOptionsQuartierIAM}
                                                    disabled={disableQuartierIAM}>
                                                </lightning-input>
                                                <div if:true={searchResultsQuartierIAM}
                                                    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                                    role="listbox">
                                                    <ul class="slds-listbox slds-listbox_vertical"
                                                        role="presentation">
                                                        <template for:each={searchResultsQuartierIAM}
                                                            for:item="searchResultsQuartierIAM">
                                                            <li key={searchResultsQuartierIAM.value}
                                                                data-value={searchResultsQuartierIAM.value}
                                                                role="presentation" 
                                                                onclick={selectSearchResultQuartierIAM}
                                                                class="slds-listbox__item">
                                                                <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small "
                                                                    role="option">
                                                                    <span class="slds-media__body">
                                                                        <span class="slds-truncate"
                                                                            title={searchResultsQuartierIAM.label}>
                                                                            {searchResultsQuartierIAM.label}
                                                                        </span>
                                                                    </span>
                                                                </div>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </div>
                                           
                                            <div class="slds-col slds-size_1-of-2">
                                           
                                                <label class="slds-form-element__label">Voie<span class="slds-required">*</span></label>
                                               
                                                <lightning-input placeholder="Voie" onchange={getVoies}
                                                    value={labelVoie} type="search"
                                                    onclick={showPicklistOptionsVoie}
                                                    disabled={disableVoie}>
                                                </lightning-input>
                                                <div if:true={searchResultsVoie}
                                                    class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                                    role="listbox">
                                                    <ul class="slds-listbox slds-listbox_vertical"
                                                        role="presentation">
                                                        <template for:each={searchResultsVoie}
                                                            for:item="searchResultsVoie">
                                                            <li key={searchResultsVoie.value}
                                                                data-value={searchResultsVoie.value}
                                                                role="presentation"
                                                                onclick={selectSearchResultVoie}
                                                                class="slds-listbox__item">
                                                                <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small "
                                                                    role="option">
                                                                    <span class="slds-media__body">
                                                                        <span class="slds-truncate"
                                                                            title={searchResultsVoie.label}>
                                                                            {searchResultsVoie.label}
                                                                        </span>
                                                                    </span>
                                                                </div>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </div>
                                            </div>
                                        
                                      
                                        <div class="slds-col slds-size_1-of-2">
                                            <label class="slds-form-element__label">Numéro de la voie</label>       
                                            <lightning-input placeholder="Numéro de la voie"
                                                onchange={getNumVoies} 
                                                value={labelNumVoie} type="search"
                                                onclick={showPicklistOptionsNumVoies}
                                                onkeydown={handleKeyPress} disabled={disableNumVoie}>
                                            </lightning-input>
                                            <div if:true={searchResultsNumVoies}
                                                class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid"
                                                role="listbox">
                                                <ul class="slds-listbox slds-listbox_vertical"
                                                    role="presentation">
                                                    <template for:each={searchResultsNumVoies}
                                                        for:item="searchResultsNumVoies">
                                                        <li key={searchResultsNumVoies.value}
                                                            data-value={searchResultsNumVoies.value}
                                                            role="presentation"
                                                            onclick={selectSearchResultNumVoies}
                                                            class="slds-listbox__item">
                                                            <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small "
                                                                role="option">
                                                                <span class="slds-media__body">
                                                                    <span class="slds-truncate"
                                                                        title={searchResultsNumVoies.label}>
                                                                        {searchResultsNumVoies.label}
                                                                    </span>
                                                                </span>
                                                            </div>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </div>

                                        </div>
                                      
                                        <div class="slds-col slds-size_1-of-2">
                                            <label class="slds-form-element__label">Bâtiment</label>                                                  
                                            <lightning-input type="text" onchange={handleinputIAM}
                                                name="batiment" 
                                                placeholder="Saisir le Bâtiment" value={batiment}
                                                 maxlength="5"  message-when-pattern-mismatch="batiment doit contenir que 5 Chiffres">
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <label class="slds-form-element__label">Escalier</label>                                                  
                                            <lightning-input type="text" onchange={handleinputIAM}
                                                name="escalier" 
                                                placeholder="Saisir l'Escalier" value={escalier}
                                                 maxlength="3"  message-when-pattern-mismatch="Escalier doit contenir que 3 Chiffres">
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <label class="slds-form-element__label">Etage</label>                                                      
                                            <lightning-input type="text" onchange={handleinputIAM}
                                                name="etage"  placeholder="Saisir l'Etage"
                                                value={etage}
                                                 maxlength="2"  message-when-pattern-mismatch="Etage doit contenir que 2 Chiffres">
                                            </lightning-input>
                                        </div>
                                        <div class="slds-col slds-size_1-of-2">
                                            <label class="slds-form-element__label">Porte</label>                                                      
                                            <lightning-input type="text" onchange={handleinputIAM}
                                                name="porte"  placeholder="Saisir la Porte"
                                                value={porte} maxlength="5"  message-when-pattern-mismatch="Porte doit contenir que 5 Chiffres">
                                            
                                            </lightning-input>
                                        
                                        </div>
                                    </div>
                                </div>
                       




                    <lightning-button label="Rechercher" variant="brand" onclick={checkFieldsIAM}
                        class="slds-float_right" style="padding: 10px;"
                        disabled={flagSearch}></lightning-button>
                  
                  
                    <lightning-button label="Quitter" variant="brand" onclick={next}
                        class="slds-float_right" style="padding: 10px;"></lightning-button>


        </template>
       
    </template>
   




    
    



</template> 
</template>
