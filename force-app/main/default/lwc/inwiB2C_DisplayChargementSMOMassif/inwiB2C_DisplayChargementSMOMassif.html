<template>
    <lightning-layout multiple-rows>
        <lightning-layout-item size="6" padding="around-small">
            <lightning-input type="search" label="Rechercher" onchange={handleSearch}></lightning-input>
        </lightning-layout-item>
    </lightning-layout>
    <br>
    <template if:false={selectSub}>
 
    <div style="height: 100%" >
        <lightning-datatable
                key-field="id"
                hide-checkbox-column="true"
                columns={columns}
                data={data}>
        </lightning-datatable>
    </div>   </template>
    <template if:true={selectSub}>
    <div style="height: 100%" >
        <lightning-datatable
                key-field="id"
                columns={columns}
                data={data}
                onrowaction={handleRowAction}
                onrowselection={handleRowSelection}>
        </lightning-datatable>
    </div>
 
</template>
    <div class="slds-m-around_medium">
        <p class="slds-align_absolute-center"> page {page} de {totalPage}</p>
        <c-inwi-b2-c_-child-paginator onprevious={prevHandler} onnext={nextHandler}></c-inwi-b2-c_-child-paginator>
    </div>   
    <template if:true={selectSub}>
        <div class="slds-grid slds-grid_align-end">
            <lightning-button 
                label="Enregistrer" 
                variant="brand" 
                onclick={handlePublishButtonClick} 
                class="elementMargin2"
                disabled ={norwos}>
            </lightning-button>
        </div>
</template>
</template>
