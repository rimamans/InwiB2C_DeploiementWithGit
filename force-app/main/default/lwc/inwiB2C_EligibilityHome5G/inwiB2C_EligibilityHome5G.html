<template>
  <lightning-card title="Saisie d'adresse">

      <div class="coordinates">
        <lightning-input
          class="gps"
          type="text"
          label="Latitude"
          value={latitude}
          disabled
        >
        </lightning-input>

        <lightning-input
          class="gps"
          type="text"
          label="Longitude"
          value={longitude}
          disabled
        >
        </lightning-input>
      </div>
       <br />
    <!-- </div> -->
      <div class="button-container">
        <lightning-button
          class="btn-eligible"
          variant="brand"
          label="Tester mon éligibilité"
          onclick={checkEligibility5G}
          if:true={isSearchDone}
        ></lightning-button> 
      
      <!-- <lightning-button
          class="btn-acqui"
          variant="brand"
          label="Suivant"
          onclick={redirectAcquisition}
        >
        </lightning-button> -->
    </div>
    <br />
    <iframe
      src="/apex/InwiB2C_EligibilityHome5GVf"
      style="width: 100%; height: 800px; border: none"
    ></iframe>

    <template if:true={showEligibilityPopup}>
      <div class="popup-overlay">
        <div class="popup">
          <p>{eligibilityMessage}</p>
          <div class="popup-buttons">
            <lightning-button
              label="Suivant"
              variant="brand"
              onclick={handleNext}
            ></lightning-button>
            <lightning-button
              label="Nouvelle recherche"
              onclick={handleNewSearch}
              variant="neutral"
            ></lightning-button>
          </div>
        </div>
      </div>
    </template>

    <br />
    
  </lightning-card>
</template>
