<template>



    <template if:true={vlccart}>
        <template if:true={__loadingCart}>
            <div style="text-align: center; margin-top: 30px;"><strong>Chargement en cours...</strong></div>
        </template>
        <template if:false={__loadingCart}>
           <lightning-card variant="Narrow" title="Panier" icon-name="standard:webcart">
            <template if:false={isLivraison}>
                <lightning-button label="Ajouter un produit" onclick={addProduct} slot="actions"></lightning-button>
            </template>
            <lightning-button label="valider" onclick={SaveAndNext} disabled={__disableValidate} slot="actions"></lightning-button>

            <div class="wraperClass ">
                <table class="sty-table-case slds-table slds-table_bordered slds-table_fixed-layout">
                    <thead>
                        <tr class="">
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Produit">Produit</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="oneTime">Prix unitaire</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Error">Erreurs</div>
                            </th>
                            <th class="" scope="col">
                                <div class="slds-truncate" title="Promotion">Promotion</div>
                            </th>
                            <template if:false={isLivraison}>
                                <th class="" scope="col">
                                    <div class="slds-truncate" title="Delete">Supprimer</div>
                                </th>
                            </template>

                            <th class="" scope="col">
                                <div class="slds-truncate" title="Delete">Configurer</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={__data} for:item="item">
                            <tr key={item.Id.value}>
                                <td class="slds-cell-wrap">
                                    <div class="slds-line-clamp">{item.Name}</div>
                                </td>
                                <!--<td class="slds-cell-wrap" > <div class="slds-line-clamp">{item.vlocity_cmt__EffectiveOneTimeTotal__c.value} MAD</div> </td>-->
                                <td class="slds-cell-wrap">
                                    <lightning-formatted-number value={item.vlocity_cmt__EffectiveOneTimeTotal__c.value}
                                        format-style="currency" currency-code="MAD" currency-display-as="symbol">
                                    </lightning-formatted-number>
                                </td>
                                <td class="slds-cell-wrap">
                                    <template if:true={item.has_error_messages}>    
                                    
                                            <lightning-button-icon icon-name="utility:warning"
                                                variant="destructive-text" alternative-text="Selectionner"
                                                id={item.Id.value} name={item} onclick={openModal}>   <!--Amine Brm Anoimalie 12621 -->
                                            </lightning-button-icon>
                                        </template>
                                </td>
                                <td class="slds-cell-wrap">
                                    {item.promotion}
                                </td>

                                <template if:false={isLivraison}>
                                    <td class="slds-cell-wrap">
                                        <div class="slds-line-clamp">

                                            <lightning-button-icon icon-name="utility:delete" variant="destructive-text"
                                                alternative-text="Supprimer" id={item.Id.value} name={item}
                                                onclick={deleteItem}></lightning-button-icon>

                                        </div>
                                    </td>
                                </template>

                                <td class="slds-cell-wrap">
                                    <div class="slds-line-clamp">
                                     <!--  Amine brm anomalie 12621  <template if:true={item.Product2.vlocity_cmt__IsConfigurable__c}>  </template> -->  
                                        <template if:false={idsaporder}>
                                               <lightning-button-icon icon-name="utility:setup" variant="destructive-text"
                                                alternative-text="Configurer" id={item.Id.value} name={item}
                                                onclick={selectItem}></lightning-button-icon>
                                        </template>
                                  
                                       
                                    </div>
                                </td>



                            </tr>
                        </template>

                    </tbody>
                </table>

            </div>





            <p slot="footer">Total: <lightning-formatted-number value={cartTotalAmount}
                format-style="currency" currency-code="MAD" currency-display-as="symbol">
            </lightning-formatted-number></p>
           </lightning-card>
       </template>





    </template>
    

    <!--  Amine brm Anomalie 12621 -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Erreur
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p><b>Liste des erreurs
                        </b></p>
                    <div>
                        <ul class="slds-m-around_medium">
                            <template for:each={__dataErrors} for:item="error">
                                <li key={error.messageId}>
                                    {error.message}
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={closeModal} title="Cancel">Cancel</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
