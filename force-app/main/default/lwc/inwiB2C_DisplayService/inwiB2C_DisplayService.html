      <p style="color: red">{errormessage}</p>
     
  </template><template if:true={datainfo}>
   
 
        <strong class="slds-align_absolute-center" style="height:10rem">Liste des sites</strong>
     
<lightning-combobox style="width:50%" name="statuseligible" label="Statut d'éligibilité" value={valuestatus} placeholder="Selectionner le statut" options={options} onchange={handleChangestatus} ></lightning-combobox>
   <br>
  <div class="wraperClass">
    <table class="slds-table slds-table_cell-buffer  slds-table_col-bordered "
        style="border-style: solid; border-color: #92107F; padding: 10px; border-radius: 10px;">
      <thead>
                <tr class="slds-line-height_reset" style="border-style: solid; border-color: #92107F; padding: 10px; border-radius: 10px;">
                    
                    <th scope="col" >
                        
                        <div class="slds-truncate"  title="radios">choix</div>
                    </th>
                    <th class="" scope="col" >
                        <div class="slds-truncate">Adresse</div>
                    </th>
                    <th class="sortable" scope="col">
                        <div class="slds-truncate">Eligible</div>
                    
                    </th>
                 <!--   <th class="" scope="col">
                        <div class="slds-truncate">Nd</div>
                    </th>-->
                    
                </tr>
            </thead>
            <tbody>
                <template for:each={__data} for:item="item">
                    <tr key={item.index} style="border-style: solid; border-color: #92107F; padding: 1px; border-radius: 1px;">
                    
                        <td  ><input type="radio" name="choix" 
                            onchange={handleSelectedAccounts} id={item.Id} data-idline={item.Id} data-city={item.City}
                           />
                            </td>
                        <td >
                            {item.Adresse}
                        </td>
                        <td >
                            {item.Eligibilite}
                        </td>
                    <!--    <td  >
                            {item.Nd}
                        </td>-->
                    </tr>
                </template>
            </tbody>
        </table>
        

    </div>



</template> 
<template if:false={datainfo}>

<div style="text-align: center; margin-top: 30px;">
    <div  class="slds-text-heading_large"><p style="color: red">Le client ne possède aucun site, veuillez créer un nouveau site.</p>

</div>
</template>

<strong class="slds-align_absolute-center" style="height:5rem"> Liste des plaques</strong>

<div class="slds-grid slds-gutters">
    <div class="slds-col slds-size_1-of-4" style="border-right: 1px solid rgb(217, 219, 221);">
        <div>
            <lightning-input type="text" value={search} onchange={handleChangeSearch} label="Rechercher par nom"></lightning-input>
        </div>
       
    </div>
    <div class="slds-col slds-size_3-of-4">
        <div class="wraperClass " style="min-height: 250px;">

            <table class="sty-table-case slds-table slds-table_bordered slds-table_fixed-layout">
                <thead>
                    <tr class="">
                        <th class="" scope="col">
                <div class="slds-truncate" title="radios">choix</div>
            </th>
            <th class="" scope="col">
                <div class="slds-truncate">Ville</div>
            </th>
            <th class="" scope="col">
                <div class="slds-truncate">Reférence</div>
            </th>
            <th class="" scope="col">
                <div class="slds-truncate">Nom</div>
            </th>
            <th class="" scope="col">
                <div class="slds-truncate">Vendeur</div>
            </th>
                 
        </tr>
          </thead>
          <tbody>
              <template for:each={__dataplaque} for:item="itemPlaque">
                  <tr key={itemPlaque.index}  style="border-style: solid; border-color: #92107F; padding: 10px; border-radius: 10px;">
                  
                      <td><input type="radio" name="itemPlaque.Id" onclick={handleSelectPlaque}
                           id={itemPlaque.Id} data-idline={itemPlaque.Id}
                           data-city={itemPlaque.place.city} 
                           data-referredtype={itemPlaque.referredType} 
                           data-name={itemPlaque.name} 
                           data-vendor={itemPlaque.vendor}
                           data-statut={itemPlaque.statut}
                           />
                          </td>
                      <td class="slds-cell-wrap">
                          {itemPlaque.place.city}
                      </td>
                      <td class="slds-cell-wrap">
                          {itemPlaque.referredType}
                      </td>
                      <td class="slds-cell-wrap">
                          {itemPlaque.name}
                      </td>
                      <td class="slds-cell-wrap">
                        {itemPlaque.vendor}
                    </td>
                  </tr>
              </template>
          </tbody>
      </table>
    </div> </div>

  </div>

</div>
</template>
