<template>

    <template if:true={vlccart}>


        <div class="slds-grid slds-wrap slds-gutters slds-p-horizontal_medium">
            <div class="slds-col slds-order_1 slds-medium-order_2 slds-size_12-of-12 slds-medium-size_6-of-12">

            </div>
            <div class="slds-col slds-order_1 slds-medium-order_2 slds-size_12-of-12 slds-medium-size_6-of-12">
                <div class="slds-grid slds-wrap slds-grid_align-end omniscript-button-position">
                    <lightning-button variant="brand" label="Panier" title="Panier" onclick={openModal}
                        class="omniscript-btn-next slds-size_12-of-12 slds-m-bottom_xx-small slds-medium-size_2-of-12">
                    </lightning-button>
                </div>

            </div>
        </div>

        <!--Use template if:true to display/hide popup based on isModalOpen value-->
        <template if:true={isModalOpen}>
            <!-- Modal/Popup Box LWC starts here -->
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <!-- Modal/Popup Box LWC header here -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Fermer" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Pannier
                            <lightning-badge label={vlccart.totalSize}></lightning-badge> {cartTotalAmount} MAD
                        </h2>
                    </header>
                    <!-- Modal/Popup Box LWC body starts here -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">


                        <c-inwi-b2-c_-display-cart vlccart={vlccart} display-errors=false> </c-inwi-b2-c_-display-cart>
                    </div>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>




    </template>

</template>
