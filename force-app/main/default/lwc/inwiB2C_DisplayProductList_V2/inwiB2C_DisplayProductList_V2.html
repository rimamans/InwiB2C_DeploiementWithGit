<template>
  <template if:true={products}>
    <div class="slds-grid slds-wrap slds-grid_vertical-stretch cardCover">
      <template for:each={productList} for:item="product">
        <div class="slds-col slds-size_1-of-3 containerCard" key={product.Id.value} data-idproduct={product.Id.value} data-productname={product.Name.value}
        onclick={handleProductSelectionFromDev}>

        <table style="height: 100%;">
            <tr>
              <td class="tdspacing">
                <div class="titleSection">{product.Name.value}</div>
              </td>
            </tr>
            <tr>
              <td class="tdspacing">
                <div class="bodySection">
                  <p class="descriptionBody">{product.Product2.Description}</p>
                </div>
              </td>
            </tr>
            <tr>
              <td class="tdspacing">
                <div class="footerSection">
                  <template if:true={product.Attachments} for:each={product.Attachments} for:item="att">
                    <img src={att.url} id={product.Id.value} name={product.Id.value} class="imageBody" key={att.url} />
                  </template>
                  <!--
                  {product.UnitPrice.value}
                  -->
                </div>
              </td>
            </tr>
          </table>


        </div>

      </template>






    </div>


  </template>
