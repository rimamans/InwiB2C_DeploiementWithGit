<template>
    <div class="slds-p-bottom--small">
        <div class="slds-m-bottom_xx-large overflowVisible ">
            <br>
            <br>
            <template if:false={isMemberClub}>
                <div style="text-align: center;">
                    <p style="color: red; font-size: 14px; font-weight: bold;margin-bottom: 20px;">Ce MDN n'est pas
                        souscrit au programme CLUB
                        INWI</p>
                    <lightning-button style="margin-top: 10px;" variant="brand" label="S'inscrire"
                        data-theid="checkCode" title="S'inscrire" onclick={inscriptionClub} disabled={disableButton}
                        class="slds-col slds-size_1-of-3 checkCodeStyle"></lightning-button>
                </div>
            </template>

            <template if:false={isCodeOk}>
                <!-- <div class="slds-grid slds-wrap slds-grid_vertical-stretch">
                    <lightning-input type="text" data-theid="code" label="Code" placeholder="Veuillez saisir le code secret"
                        class="slds-col slds-size_2-of-3 "></lightning-input>
                    <lightning-button style="margin-top: 18px; padding-left: 10px;" variant="brand" label="Vérifier le code" data-theid="checkCode" title="Vérifier le code"
                        onclick={checkCode} class="slds-col slds-size_1-of-3 checkCodeStyle"></lightning-button>
                </div>
                <br> -->
                <!-- <lightning-button variant="base" label="resend code" data-theid="resendCode" title="resend code"
                    onclick={savecontract} class=""></lightning-button> -->
            </template>
            <br>
            <br>
            <template if:true={isMemberClub}>
                <strong>Liste des produits: </strong>
                <template if:false={loadingProduct}>
                    <div class="wraperClass ">
                        <lightning-datatable key-field="documentId" columns={columns} data={dataProducts}
                            onrowselection={handleOpenModal}>
                        </lightning-datatable>
                    </div>
                </template>
                <!-- <template if:false={dataProducts}>
                    <div class="nocard slds-col slds-size--1-of-1 slds-text-align_center ">
                        <br>
                        <br>
                        Aucun Produit
                    </div>
                </template> -->
                <div class="exampleHolder" if:true={loadingProduct}>
                    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
                </div>
            </template>
            <template if:true={isModalOpen}>
                <!-- Modal/Popup Box LWC starts here -->
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <!-- Modal/Popup Box LWC header here -->
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleCloseModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                    size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Confirmation du
                                produit</h2>
                        </header>
                        <!-- Modal/Popup Box LWC body starts here -->
                        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                            <p><b>Etes-vous sûre de vouloir choisir le produit: {selectedRow.name}
                                </b></p>
                        </div>
                        <!-- Modal/Popup Box LWC footer starts here -->
                        <footer class="slds-modal__footer">
                            <button class="slds-button slds-button_neutral" onclick={handleCloseModal}
                                title="Cancel">Cancel</button>
                            <button class="slds-button slds-button_brand" onclick={getSelectedName}
                                title="OK">Confirmer</button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </div>
</template>
