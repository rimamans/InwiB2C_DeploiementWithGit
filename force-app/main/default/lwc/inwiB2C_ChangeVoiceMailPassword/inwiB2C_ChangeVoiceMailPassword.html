<template>
    <div class="slds-m-top_medium slds-m-bottom_x-large">
        <div class="slds-p-around_medium lgc-bg">

            <p>Vous avez le choix entre :</p>
            <ul>
                <li>Saisir un nouveau mot de passe et valider</li>
                <li>Cliquer directement sur valider pour générer un mot de passe automatique qui sera envoyé au client
                    par
                    SMS</li>
            </ul>
        </div>
        <div class="slds-grid slds-gutters">
            <div class="slds-col">
                <lightning-input type="number" name="__password" value={__password} onchange={handleChange}
                    label="Mot de Passe (Le code doit être composer de 4 chiffres)"></lightning-input>
            </div>
            <div class="slds-col" style="margin-top: 24px;">
                <lightning-button variant="brand" label="Valider" type="submit" title="Valider" onclick={handleModify}
                    disabled={__loading} class="slds-m-left_x-large slds-m-top_x-large">
                </lightning-button>
            </div>
        </div>
    </div>
</template>
