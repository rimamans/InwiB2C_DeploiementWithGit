<template>
  <lightning-card title="Saisie d'adresse Maroc Telecom">
    <div class="slds-p-around-medium">
      <lightning-combobox
        class="combo"
        label="Province/Ville"
        placeholder="Entrer votre province/ville"
        required
        value={selectedProVille}
        options={proVilleOptions}
        onchange={handleProvinceChange}
      >
      </lightning-combobox>
      <div class="slds-grid slds-gutters">
        <div class="slds-col slds-size_1-of-2">
          <lightning-combobox
            class="combo"
            label="Commune"
            placeholder="Entrer votre commune"
            required
            disabled={isCommuneDisabled}
            value={selectedCommune}
            options={communeOptions}
            onchange={handleCommuneChange}
          >
          </lightning-combobox>
        </div>
        <div class="slds-col slds-size_1-of-2">
          <lightning-combobox
            class="quartier"
            label="Quartier"
            placeholder="Entrer votre quartier"
            required
            value={selectedQuartier}
            options={quartierOptions}
            onchange={handleQuartierChange}
          >
          </lightning-combobox>
        </div>
      </div>

      <lightning-combobox
        class="combo"
        label="Voie"
        placeholder="Entrer votre voie"
        required
        value={selectedVoie}
        options={voieOptions}
        onchange={handleVoieChange}
      >
      </lightning-combobox>

      <lightning-input
        class="combo"
        label="Numéro dans la voie"
        placeholder="Entrer votre numéro dans la voie "
        required
        value={numeroVoie}
        onchange={handleInputChange}
      >
      </lightning-input>
    </div>
  </lightning-card>
   <lightning-card title="Je teste mon éligibilité">
    <div class="input-button-container">
      <lightning-input
        id="autocomplete"
        class="address-input"
        placeholder="Saisissez votre adresse"
        value={address}
        onchange={handleAddressChange}
      ></lightning-input>
      <lightning-button
        class="btn-space"
        label="Tester mon éligibilité"
        onclick={handleSearch}
      ></lightning-button>
    </div>
    <lightning-map
      map-markers={mapMarkers}
      zoom-level={zoomLevel}
      onmarkerselect={handleMarkerSelect}
      center={mapCenter}
    >
    </lightning-map>
  </lightning-card>
</template>
