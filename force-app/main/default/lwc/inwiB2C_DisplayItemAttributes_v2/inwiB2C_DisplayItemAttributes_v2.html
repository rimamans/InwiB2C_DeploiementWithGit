<template>

    <template if:true={item}>

        <template if:true={isAcquisition}>

            <template if:true={hasAttributes}>

                <lightning-card title={item.Name}>

                    <template if:true={isSim}>
                        <c-inwi-b2-c_sim-entry item={item} typeparcour={__typeparcour}
                            oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                            oncustomdeviceaccessvalidated={handleCustomimeivalidated}
                            oncustomitemvalidationerror={handlecustomitemvalidationerror}> </c-inwi-b2-c_sim-entry>
                    </template>

                    <template if:true={isMDN}>
                        <c-inwi-b2-c_-mdn-research item={item} product={__product} iswakil={__iswakil} typeparcour={__typeparcour} 
                            oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                            statutligne={statutligne}
                            onmdnprovisoiresuccess={handleMdnProvisoireSuccess}
                            oncustomitemvalidationerror={handlecustomitemvalidationerror}> </c-inwi-b2-c_-mdn-research>
                    </template>
                   
                    <template if:true={isTerm} >
                        <c-inwi-b2-c_-terminal-selection-v3 item={item} product={__product} displayimeiftth={__displayimeiftth} disabledinputimei={__disabledinputimei} typeparcour={__typeparcour} provider={__provider} isrepriseeshop={__isrepriseeshop} operateur={__operateur} paiement={__paiement} typecanal={__typecanal} modelivraison={__modelivraison} nameagencelivraison={__nameagencelivraison} codeagencelivraison={__codeagencelivraison} selectedmodel={__selectedmodel} reprisesuitelivraison={__reprisesuitelivraison}
                            isagencevalidationbocrcd2d={__isagencevalidationbocrcd2d}
                            oncustomvalidatecodearticle={handleCustomValidateCodeArticle}
                            oncustomdeviceaccessvalidated={handleCustomimeivalidated}
                            oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                            oncustomitemattributeswithoutimei={handlecustomItemAttributesWithoutImei}
                            oncustomitemvalidationerror={handlecustomitemvalidationerror}>                            
                        </c-inwi-b2-c_-terminal-selection-v3>
                    </template>
                   
                    <template if:true={isParent}>
                        <!--R-SL 03/09/2025 MGEN3688-B2C Vente Wafacash_v1.5 start-->
                        <c-inwi-b2-c_-display-parent-attribute item={item} cin={__cin} accountid={__accountid}
                            username={__username} typepos={__typepos} iswafacash={__iswafacash}  iswakil={__iswakil} isftthvula={__isftthvula}  demenagement={__demenagement} isfar={__isfar} product={__product} typeparcour={__typeparcour} modepaiment={__modepaiment}
                            onchangelignetype={handleChangeLigneType} permissiondgsndgpc={__permissiondgsndgpc} permissionpuppilesdgpc={__permissionpuppilesdgpc} isocpallowed={__isocpallowed}
                            oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}>
                        </c-inwi-b2-c_-display-parent-attribute>
                        <!--R-SL 03/09/2025 MGEN3688-B2C Vente Wafacash_v1.5 end-->
                    </template>



                    <template if:true={isStandardItem}>
                        <c-inwi-b2-c_-display-attribute-categories attribute-categories={item.attributeCategories}
                            onattributecategoriesvaluechange={hanldeAttributeCategroriesValueChange}>
                        </c-inwi-b2-c_-display-attribute-categories>

                    </template>

                </lightning-card>

            </template>
            <!--    
            <template if:true={isStandardItem}>

                <c-inwi-b2-c_-display-line-item-attributes line-items={item.lineItems}  action-type={actionType} onlineitemstemattributesvaluechange={hanldeLineItemAttributesValueChange} onlineitemattributesvalidationerror={handlelineitemattributesvalidationerror}> </c-inwi-b2-c_-display-line-item-attributes>
    
            </template>
            -->
        </template>





        <template if:true={isModifNumber}>
            <template if:true={isMDN}>

                <c-inwi-b2-c_-mdn-modification item={item} user-profile={userProfile}
                    oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                    oncustomitemvalidationerror={handlecustomitemvalidationerror}> </c-inwi-b2-c_-mdn-modification>

            </template>
            <!--template if:true={isChTerm}>

                <c-inwi-b2-c_-modification-terminal item={item} oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange} oncustomitemvalidationerror={handlecustomitemvalidationerror} > </c-inwi-b2-c_-modification-terminal>

            </template-->

            <template if:true={isStandardItem}>

                <c-inwi-b2-c_-display-line-item-attributes line-items={item.lineItems} user-profile={userProfile}
                    action-type={actionType} onlineitemstemattributesvaluechange={hanldeLineItemAttributesValueChange}
                    onlineitemattributesvalidationerror={handlelineitemattributesvalidationerror}>
                </c-inwi-b2-c_-display-line-item-attributes>

            </template>

        </template>
        <template if:true={isSMOTerm}>

            <template if:true={isChTerm}>

                <c-inwi-b2-c_-modification-terminal item={item} type-terminal={typeTerminal}
                    oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                    oncustomitemvalidationerror={handlecustomitemvalidationerror}
                    oncustomitemattribvaluechangewithnext={handlecustomitemattribvaluechangewithnext}>
                </c-inwi-b2-c_-modification-terminal>

            </template>


            <template if:true={isStandardItem}>

                <c-inwi-b2-c_-display-line-item-attributes line-items={item.lineItems} action-type={actionType}
                    onlineitemstemattributesvaluechange={hanldeLineItemAttributesValueChange}
                    onlineitemattributesvalidationerror={handlelineitemattributesvalidationerror}
                    oncustomitemattribvaluechangewithnext={handlecustomitemattribvaluechangewithnext}>
                </c-inwi-b2-c_-display-line-item-attributes>

            </template>

        </template>


        <template if:true={isAcquisitionSuspension}>


            <c-inwi-b2-c_-suspension-rehab item={item} user-profile={userProfile}
                oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                oncustomitemattribvaluechangewithnext={handlecustomitemattribvaluechangewithnext}>
            </c-inwi-b2-c_-suspension-rehab>



        </template>
        <template if:true={isRehabilitation}>


            <c-inwi-b2-c_-rehabilitation-component item={item}
                oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                oncustomitemattribvaluechangewithnext={handlecustomitemattribvaluechangewithnext}>
            </c-inwi-b2-c_-rehabilitation-component>



        </template>


        <template if:true={isSMOSim}>

            <template if:true={isStandardItem}>
                <c-inwi-b2-c_-display-line-item-attributes line-items={item.lineItems} action-type={actionType}
                    onlineitemstemattributesvaluechange={hanldeLineItemAttributesValueChange}
                    oncustomitemattribvaluechangewithnext={handlecustomitemattribvaluechangewithnext}
                    onlineitemattributesvalidationerror={handlelineitemattributesvalidationerror}>
                </c-inwi-b2-c_-display-line-item-attributes>
            </template>
            <template if:true={isSim}>
                <lightning-card title="">
                    <c-inwi-b2-c_-modification-sim item={item}
                        oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                        oncustomitemattribvaluechangewithnext={handlecustomitemattribvaluechangewithnext}
                        oncustomitemvalidationerror={handlecustomitemvalidationerror}> </c-inwi-b2-c_-modification-sim>
                </lightning-card>
            </template>
        </template>

        <template if:true={isMigration}>
            <template if:true={isParent}>
                <c-inwi-b2-c_-display-parent-attribute item={item} cin={__cin} isfar={__isfar} accountid={__accountid}
                    username={__username} typepos={__typepos} product={__product}  iswakil={__iswakil} isftthvula={__isftthvula}  permissiondgsndgpc={__permissiondgsndgpc} permissionpuppilesdgpc={__permissionpuppilesdgpc} checkcampus={__checkcampus}
                    oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                    onchangelignetype={handleChangeLigneType}>
                </c-inwi-b2-c_-display-parent-attribute>
            </template>

            <template if:true={isStandardItem}>
                <c-inwi-b2-c_-display-attribute-categories attribute-categories={item.attributeCategories}
                    onattributecategoriesvaluechange={hanldeAttributeCategroriesValueChange}>
                </c-inwi-b2-c_-display-attribute-categories>
            </template>

            <template if:true={isSim}>
                <c-inwi-b2-c_sim-entry item={item} type={__actionType}
                    oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                    oncustomdeviceaccessvalidated={handleCustomimeivalidated}
                    oncustomitemvalidationerror={handlecustomitemvalidationerror}> </c-inwi-b2-c_sim-entry>
            </template>
            
            <template if:true={isTerm}>
                <c-inwi-b2-c_-terminal-selection-v3 item={item} provider={__provider} isrepriseeshop={__isrepriseeshop} operateur={__operateur} isftthvula={__isftthvula} product={__product}  displayimeiftth={__displayimeiftth} disabledinputimei={__disabledinputimei}
                    isagencevalidationbocrcd2d={__isagencevalidationbocrcd2d}
                    oncustomvalidatecodearticle={handleCustomValidateCodeArticle}
                    oncustomdeviceaccessvalidated={handleCustomimeivalidated}
                    oncustomitemattributesvaluechange={hanldeCustomItemAttributesValueChange}
                    oncustomitemvalidationerror={handlecustomitemvalidationerror}>
                </c-inwi-b2-c_-terminal-selection-v3>
            </template>
            
        </template>

     

        <template if:true={isChangeOption}>
            <template if:true={hasAttributes}>

                <template if:true={isServRoam}>
                    <lightning-card title={item.Name}>


                        <c-inwi-b2-c_-display-attribute-categories attribute-categories={item.attributeCategories}
                            onattributecategoriesvaluechange={hanldeAttributeCategroriesValueChange}>
                        </c-inwi-b2-c_-display-attribute-categories>



                    </lightning-card>
                </template>

            </template>

            <!-- <template if:true={isStandardItem}>

                <c-inwi-b2-c_-display-line-item-attributes line-items={item.lineItems} action-type={actionType}
                    onlineitemstemattributesvaluechange={hanldeLineItemAttributesValueChange}
                    onlineitemattributesvalidationerror={handlelineitemattributesvalidationerror}>
                </c-inwi-b2-c_-display-line-item-attributes>

            </template> -->

            <template if:true={isStandardItem}>
                <c-inwi-b2-c_-display-attribute-categories attribute-categories={item.attributeCategories}
                    onattributecategoriesvaluechange={hanldeAttributeCategroriesValueChange}>
                </c-inwi-b2-c_-display-attribute-categories>

            </template>

        </template>

    </template>

</template>
